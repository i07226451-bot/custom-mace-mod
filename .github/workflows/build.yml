name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8
        uses: gradle/gradle-build-action@v3

      - name: Build
        run: ./gradlew build || gradle wrapper --gradle-version 8.7 && ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: custom-mace
          path: build/libs/*.jar
